correlation: absolute Spearman > 0.90
correlation_order: alphabetical greedy; keep the first representative
scaling: training-only Z-score; no patient-vector L2
model: Ridge-Cox, Breslow
ridge_grid:
- 0.01
- 0.1
- 1.0
- 10.0
- 100.0
- 1000.0
inner_folds: 3
seed: 123
selection: mean inner C-index; exact ties favor stronger ridge
evaluation: outer validation once; AUC36/60 IPCW; KM cutoff is training risk median
intensity_caveat: Doctor-provided NIfTI; upstream processing and original HU calibration
  unknown. binWidth is 25 input units; no additional clipping or normalization.
stability_caveat: No repeat-scan/reader ICC filtering without repeated measurements
scope: CT-only comparison baseline; no pathology features, fusion or neural checkpoint
  use
